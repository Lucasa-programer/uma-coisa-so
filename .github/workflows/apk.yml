name: Gerar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk UmaCoisaSo.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UmaCoisaSo-apk
          path: UmaCoisaSo.apk
      - name: Publicar na página de Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ github.run_number }}" UmaCoisaSo.apk --title "Uma Coisa Só v${{ github.run_number }}" --notes "Baixe o arquivo UmaCoisaSo.apk e instale no celular."
