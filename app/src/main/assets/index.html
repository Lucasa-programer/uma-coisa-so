<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*,*::before,*::after{box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>Uma Coisa Só</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&display=swap">
<style>
/* Layout: quadro kanban — listas de 272px lado a lado com rolagem horizontal, cartões arrastáveis */
:root{
  --board1:#1D4E89; --board2:#2B7A9E; --list:#F1F2F4; --card:#FFFFFF; --ink:#172B4D; --dim:#5E6C84; --line:#DCDFE4;
  --todo:#8590A2; --doing:#E2B203; --paused:#579DFF; --done:#4BCE97; --dropped:#F87168; --posts:#9F8FEF;
  --font:"Inter Tight",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--board1:#0F2440;--board2:#163B52;--list:#161A1D;--card:#22272B;--ink:#DEE4EA;--dim:#9FADBC;--line:#2C333A;color-scheme:dark}}
:root[data-theme="dark"]{--board1:#0F2440;--board2:#163B52;--list:#161A1D;--card:#22272B;--ink:#DEE4EA;--dim:#9FADBC;--line:#2C333A;color-scheme:dark}
html,body{height:100%}
body{background:linear-gradient(135deg,var(--board1),var(--board2));color:var(--ink);font-family:var(--font);display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:rgb(0 0 0/.18);color:#fff}
.top h1{margin:0;font-size:18px;font-weight:700}
.top span{font-size:13px;opacity:.85}
.board{flex:1;display:flex;align-items:flex-start;gap:12px;overflow-x:auto;overflow-y:hidden;padding-block:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));scroll-snap-type:x proximity}
.list{flex:0 0 272px;max-width:85vw;max-height:100%;background:var(--list);border-radius:12px;display:flex;flex-direction:column;box-shadow:0 1px 1px rgb(9 30 66/.25);scroll-snap-align:start}
.list h2{margin:0;padding:12px 12px 6px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.list h2 i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.list h2 em{margin-left:auto;font-style:normal;font-weight:500;color:var(--dim);font-size:12px;font-variant-numeric:tabular-nums}
.cards{flex:1;overflow-y:auto;padding:4px 8px;display:flex;flex-direction:column;gap:8px;min-height:8px}
.card{background:var(--card);border-radius:8px;padding:8px 12px;font-size:14px;line-height:1.35;box-shadow:0 1px 1px rgb(9 30 66/.25),0 0 1px rgb(9 30 66/.31);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow-wrap:anywhere;border:0;color:var(--ink);text-align:left;font-family:inherit;position:relative}
.card:hover{box-shadow:0 0 0 2px var(--paused) inset}
.lbls{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.lb{display:inline-block;min-width:24px;height:16px;line-height:16px;padding:0 8px;border-radius:4px;font-size:11px;font-weight:600;color:#1D2125;background:var(--lc)}
.ttl{display:block}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:12px;color:var(--dim);align-items:center}
.bd{display:inline-flex;align-items:center;gap:4px;padding:1px 6px;border-radius:4px;font-variant-numeric:tabular-nums}
.bd.late{background:#C9372C;color:#fff}.bd.soon{background:#F5CD47;color:#1D2125}.bd.ok,.bd.full{background:#1F845A;color:#fff}
.list[data-c="dropped"] .card .ttl{text-decoration:line-through;color:var(--dim)}
.sec{display:flex;flex-direction:column;gap:6px}
.lpick{border:0;border-radius:4px;padding:6px 10px;font:600 13px var(--font);color:#1D2125;background:var(--lc);cursor:pointer;opacity:.4}
.lpick[aria-pressed="true"]{opacity:1;box-shadow:0 0 0 2px var(--ink)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:#579DFF}.bar.full i{background:#4BCE97}
.ci{display:flex;gap:8px;align-items:center;font-size:14px}.ci input[type=checkbox]{width:18px;height:18px;flex:none}
.ci span{flex:1;min-width:0;overflow-wrap:anywhere}.ci.d span{text-decoration:line-through;color:var(--dim)}
.sheet input[type=date],.sheet input[type=text]{border:0;border-radius:6px;padding:8px 10px;font:14px var(--font);background:var(--card);color:var(--ink);box-shadow:0 1px 1px rgb(9 30 66/.25)}
#edT{font-weight:700;font-size:18px}
#pvT{font:13px/1.5 ui-monospace,Menlo,monospace;min-height:240px}
.sheet label.q{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600}
.tip{font-size:13px;color:var(--dim);margin:0}
.ph{border-radius:8px;background:rgb(9 30 66/.12);flex:none}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:rotate(4deg);box-shadow:0 8px 16px rgb(9 30 66/.35);opacity:.95}
.foot{padding:8px}
.addbtn{width:100%;background:none;border:0;border-radius:8px;padding:8px;text-align:left;color:var(--dim);font:600 14px var(--font);cursor:pointer}
.addbtn:hover{background:rgb(9 30 66/.08);color:var(--ink)}
.addform{display:flex;flex-direction:column;gap:8px}
.addform textarea,.sheet textarea{width:100%;box-sizing:border-box;border:0;border-radius:8px;padding:8px 12px;font:14px/1.35 var(--font);resize:none;background:var(--card);color:var(--ink);box-shadow:0 1px 1px rgb(9 30 66/.25)}
.rowb{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.b{border:0;border-radius:6px;padding:8px 12px;font:600 14px var(--font);cursor:pointer;background:rgb(9 30 66/.08);color:var(--ink)}
.b.pri{background:#0C66E4;color:#fff}
.b.red{background:#C9372C;color:#fff}
.b.x{background:none;font-size:18px;padding:4px 10px}
.b[aria-current="true"]{outline:2px solid #0C66E4}
button:focus-visible,textarea:focus-visible{outline:2px solid #388BFF;outline-offset:1px}
.sheet{position:fixed;inset:0;background:rgb(0 0 0/.55);display:flex;align-items:flex-start;justify-content:center;z-index:40;padding-top:max(48px,env(safe-area-inset-top,0px))}
.sheet>div{background:var(--list);border-radius:12px;width:calc(100% - 32px);max-width:560px;max-height:calc(100% - 64px);overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;box-sizing:border-box}
.sheet small{font-size:12px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
.hint{color:#fff;opacity:.75;font-size:12px;text-align:center;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
</style>

<div class="top"><h1>Uma Coisa Só</h1><span id="stat"></span></div>
<div class="board" id="board"></div>
<div class="hint">Segure e arraste um cartão para mudar de lista. Toque para editar.</div>
<div class="sheet" id="sheet" hidden><div id="sheetIn"></div></div>

<script>
const KEY='uma-coisa-so-quadro-v1';
const COLS=[['todo','A fazer','var(--todo)'],['doing','Fazendo','var(--doing)'],['paused','Pausado','var(--paused)'],['done','Feito','var(--done)'],['dropped','Descartado','var(--dropped)'],['posts','Posts','var(--posts)']];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S=null;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.cards){S={cards:[
  {id:1,t:'Escrever a legenda do carrossel (exemplo)',col:'todo'},
  {id:2,t:'Gravar o Reel do gancho 3 (exemplo)',col:'doing'},
  {id:3,t:'Editar capa do ebook (exemplo)',col:'paused'},
  {id:4,t:'Postar story da enquete (exemplo)',col:'done'}]}}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
let adding=null;

function render(){
  $('stat').textContent=S.cards.filter(c=>c.col==='done').length+' feitos';
  const sl=$('board').scrollLeft;
  $('board').innerHTML=COLS.map(([k,n,c])=>{const cs=S.cards.filter(x=>x.col===k);
    return `<section class="list" data-c="${k}" style="--c:${c}"><h2><i></i>${n}<em>${cs.length}</em></h2>
    <div class="cards" data-c="${k}">${cs.map(cardHTML).join('')}</div>
    <div class="foot">${adding===k?`<form class="addform" data-c="${k}"><textarea id="addT" rows="3" maxlength="200" placeholder="Insira um título para este cartão…"></textarea><div class="rowb"><button class="b pri">Adicionar cartão</button><button type="button" class="b x" id="addX" aria-label="Cancelar">✕</button></div></form>`:`<button class="addbtn" data-add="${k}">+ Adicionar um cartão</button>`}</div></section>`}).join('');
  $('board').scrollLeft=sl;
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{adding=b.dataset.add;render();$('addT').focus()});
  const f=document.querySelector('.addform');
  if(f){const t=$('addT');
    const add=()=>{const v=t.value.trim();if(v){S.cards.push({id:Date.now(),t:v,col:f.dataset.c});save()}render();if(adding)$('addT').focus()};
    f.onsubmit=e=>{e.preventDefault();add()};
    t.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();add()}if(e.key==='Escape'){adding=null;render()}};
    $('addX').onclick=()=>{adding=null;render()}}
  document.querySelectorAll('.card').forEach(bindDrag);
}

/* Arrastar: mouse começa ao mover; toque começa após segurar 220ms */
let drag=null;
function bindDrag(el){
  el.addEventListener('pointerdown',e=>{
    if(e.button!==0)return;
    const st={el,id:+el.dataset.id,x:e.clientX,y:e.clientY,touch:e.pointerType!=='mouse',on:false,timer:null};
    drag=st;
    if(st.touch)st.timer=setTimeout(()=>{if(drag===st)begin(e.clientX,e.clientY)},220);
  });
}
window.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y,far=Math.hypot(dx,dy)>6;
  if(!drag.on){if(drag.touch){if(far){clearTimeout(drag.timer);drag=null}return}if(far)begin(e.clientX,e.clientY);else return}
  e.preventDefault();moveTo(e.clientX,e.clientY);
},{passive:false});
window.addEventListener('pointerup',end);window.addEventListener('pointercancel',()=>{if(drag&&!drag.on){clearTimeout(drag.timer);drag=null}else end()});
document.addEventListener('touchmove',e=>{if(drag&&drag.on)e.preventDefault()},{passive:false});

function begin(x,y){
  const r=drag.el.getBoundingClientRect();drag.on=true;drag.ox=x-r.left;drag.oy=y-r.top;
  const g=drag.el.cloneNode(true);g.classList.add('ghost');g.style.width=r.width+'px';document.body.appendChild(g);drag.g=g;
  const ph=document.createElement('div');ph.className='ph';ph.style.height=r.height+'px';drag.el.replaceWith(ph);drag.ph=ph;
  try{navigator.vibrate&&navigator.vibrate(15)}catch(e){}
  moveTo(x,y);
}
function moveTo(x,y){
  const d=drag;d.g.style.left=(x-d.ox)+'px';d.g.style.top=(y-d.oy)+'px';
  const b=$('board'),br=b.getBoundingClientRect();
  if(x>br.right-40)b.scrollLeft+=12;else if(x<br.left+40)b.scrollLeft-=12;
  const under=document.elementFromPoint(x,y),list=under&&under.closest('.list');if(!list)return;
  const box=list.querySelector('.cards');
  const after=[...box.querySelectorAll('.card')].find(c=>{const r=c.getBoundingClientRect();return y<r.top+r.height/2});
  if(after)box.insertBefore(d.ph,after);else box.appendChild(d.ph);
}
function end(){
  const d=drag;drag=null;if(!d)return;clearTimeout(d.timer);
  if(!d.on){const c=S.cards.find(x=>x.id===d.id);if(c)openCard(c);return}
  const box=d.ph.parentNode,col=box.dataset.c;
  const nextEl=d.ph.nextElementSibling,nextId=nextEl&&nextEl.dataset.id?+nextEl.dataset.id:null;
  const c=S.cards.find(x=>x.id===d.id),prev=c.col;S.cards=S.cards.filter(x=>x!==c);c.col=col;
  if(nextId){S.cards.splice(S.cards.findIndex(x=>x.id===nextId),0,c)}else{
    const lastIdx=S.cards.map(x=>x.col).lastIndexOf(col);S.cards.splice(lastIdx+1,0,c)}
  d.g.remove();save();render();
  if(col==='done'&&prev!=='done'&&!c.src)openPost(c);
}

const LBL=[['green','Venda','#4BCE97'],['yellow','Ideia','#F5CD47'],['orange','Reel','#FEA362'],['red','Urgente','#F87168'],['purple','Conteúdo','#9F8FEF'],['blue','Ebook','#579DFF']];
const parseD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
function dueBadge(x){if(!x.due)return '';const t=new Date();t.setHours(0,0,0,0);const diff=(parseD(x.due)-t)/864e5;
  const cls=x.dueDone?'ok':diff<0?'late':diff<=1?'soon':'';
  return `<span class="bd ${cls}" title="Data de entrega">◷ ${parseD(x.due).toLocaleDateString('pt-BR',{day:'numeric',month:'short'})}</span>`}
function cardHTML(x){
  const lb=(x.labels||[]).map(id=>LBL.find(l=>l[0]===id)).filter(Boolean),ck=x.check||[],dn=ck.filter(i=>i.d).length;
  const badges=dueBadge(x)+(x.desc?'<span class="bd" title="Tem descrição">≡</span>':'')+(ck.length?`<span class="bd ${dn===ck.length?'full':''}" title="Checklist">☑ ${dn}/${ck.length}</span>`:'');
  return `<button class="card" data-id="${x.id}">${lb.length?`<span class="lbls">${lb.map(l=>`<span class="lb" style="--lc:${l[2]}">${l[1]}</span>`).join('')}</span>`:''}<span class="ttl">${esc(x.t)}</span>${badges?`<span class="badges">${badges}</span>`:''}</button>`}

function openCard(c){c.labels=c.labels||[];c.check=c.check||[];c.desc=c.desc||'';$('sheet').hidden=false;drawCard(c);$('sheetIn').scrollTop=0}
function drawCard(c,focus){
  const box=$('sheetIn'),st=box.scrollTop,ck=c.check,dn=ck.filter(i=>i.d).length,pct=ck.length?Math.round(dn/ck.length*100):0;
  box.innerHTML=`<textarea id="edT" rows="2" maxlength="200" aria-label="Título do cartão">${esc(c.t)}</textarea>
    <div class="sec"><small>Lista</small><div class="rowb">${COLS.map(([k,n])=>`<button class="b" data-to="${k}" aria-current="${c.col===k}">${n}</button>`).join('')}</div></div>
    <div class="sec"><small>Etiquetas</small><div class="rowb">${LBL.map(l=>`<button class="lpick" data-l="${l[0]}" aria-pressed="${c.labels.includes(l[0])}" style="--lc:${l[2]}">${l[1]}</button>`).join('')}</div></div>
    <div class="sec"><small>Data de entrega</small><div class="rowb"><input type="date" id="due" value="${c.due||''}" aria-label="Data de entrega"><label class="ci"><input type="checkbox" id="dueD" ${c.dueDone?'checked':''} ${c.due?'':'disabled'}>Concluído</label>${c.due?'<button class="b" id="dueX">Remover</button>':''}</div></div>
    <div class="sec"><small>Descrição</small><textarea id="desc" rows="3" maxlength="2000" placeholder="Adicione uma descrição mais detalhada…">${esc(c.desc)}</textarea></div>
    <div class="sec"><small>Checklist${ck.length?' · '+pct+'%':''}</small>${ck.length?`<div class="bar ${pct===100?'full':''}"><i style="width:${pct}%"></i></div>`:''}
      ${ck.map((it,i)=>`<div class="ci ${it.d?'d':''}"><input type="checkbox" data-ci="${i}" ${it.d?'checked':''} aria-label="Marcar item"><span>${esc(it.t)}</span><button class="b x" data-cx="${i}" aria-label="Remover item">✕</button></div>`).join('')}
      <form class="rowb" id="ckF"><input type="text" id="ckT" maxlength="120" placeholder="Adicionar um item" aria-label="Novo item" style="flex:1;min-width:0"><button class="b">Adicionar</button></form></div>
    ${c.src?`<div class="sec"><small>Post</small><div class="rowb"><button class="b pri" id="cpPost">Copiar post</button></div></div>`:(c.col==='done'||c.post)?`<div class="sec"><small>Post</small><div class="rowb"><button class="b" id="gp">${c.post?'Ver ou refazer o post':'Gerar post deste cartão'}</button></div></div>`:''}
    <div class="rowb"><button class="b pri" id="cl">Fechar</button><button class="b red" id="del" style="margin-left:auto">Excluir</button></div>`;
  box.scrollTop=st;
  if($('gp'))$('gp').onclick=()=>openPost(c);
  if($('cpPost'))$('cpPost').onclick=e=>copy(c.desc,e.target);
  const re=f=>{save();drawCard(c,f)};
  $('edT').oninput=e=>{const v=e.target.value.trim();if(v){c.t=v;save()}};
  box.querySelectorAll('[data-to]').forEach(b=>b.onclick=()=>{const k=b.dataset.to;if(k!==c.col){S.cards=S.cards.filter(x=>x!==c);c.col=k;S.cards.push(c);if(k==='done'&&!c.src){save();openPost(c)}else re()}});
  box.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{const l=b.dataset.l;c.labels=c.labels.includes(l)?c.labels.filter(x=>x!==l):[...c.labels,l];re()});
  $('due').onchange=e=>{c.due=e.target.value;if(!c.due)c.dueDone=false;re()};
  $('dueD').onchange=e=>{c.dueDone=e.target.checked;save()};
  if($('dueX'))$('dueX').onclick=()=>{c.due='';c.dueDone=false;re()};
  $('desc').oninput=e=>{c.desc=e.target.value;save()};
  box.querySelectorAll('[data-ci]').forEach(b=>b.onchange=()=>{ck[+b.dataset.ci].d=b.checked;re()});
  box.querySelectorAll('[data-cx]').forEach(b=>b.onclick=()=>{ck.splice(+b.dataset.cx,1);re()});
  $('ckF').onsubmit=e=>{e.preventDefault();const v=$('ckT').value.trim();if(v)ck.push({t:v,d:false});re('ckT')};
  $('cl').onclick=close;
  $('del').onclick=()=>{if($('del').dataset.sure){S.cards=S.cards.filter(x=>x!==c);save();close()}else{$('del').dataset.sure=1;$('del').textContent='Confirmar exclusão'}};
  if(focus)$(focus).focus();
}
function close(){$('sheet').hidden=true;render()}

/* Do Feito ao Post */
const FMT=[['reel','Roteiro de Reel'],['carrossel','Carrossel'],['legenda','Legenda']];
const clean=s=>s.trim().replace(/[.\s]+$/,'');
function buildPost(c,a,fmt){
  const F=clean(a.fiz)||clean(c.t),T=clean(a.travei)||'adiar sem perceber',A=clean(a.aprendi)||'feito vence perfeito',N=clean(a.num)||('Terminei: '+clean(c.t));
  if(fmt==='reel')return `[GANCHO 0-3s]\n${N}. E eu quase desisti antes de começar.\n\n[TRAVA 3-12s]\nO que me travou: ${T}. Se você planeja mais do que faz, conhece essa sensação.\n\n[VIRADA 12-30s]\nO que eu fiz: ${F}.\nO que eu aprendi: ${A}.\n\n[CHAMADA 30-35s]\nSalva este vídeo e escolhe uma coisa só para fazer hoje. Lúcido não planeja, executa.`;
  if(fmt==='carrossel')return `SLIDE 1\n${N}. Veja como eu saí do loop.\n\nSLIDE 2\nO que me travava: ${T}.\n\nSLIDE 3\nO que eu fiz: ${F}.\n\nSLIDE 4\nO que eu aprendi: ${A}.\n\nSLIDE 5\nSua vez: escolha uma coisa só e faça hoje. Salve este post para lembrar.`;
  return `${N}.\n\nEu travei em: ${T}. Saí do loop assim: ${F}.\n\nO que aprendi: ${A}.\n\nE você, qual é a única coisa que vai fazer hoje? Comenta aqui.`;
}
function openPost(c){
  const p=c.post||{a:{},fmt:'reel'},a=p.a;let fmt=p.fmt;
  $('sheet').hidden=false;const box=$('sheetIn');
  box.innerHTML=`<small>Feito! Transforme em conteúdo</small><h3 style="margin:0;font-size:18px;overflow-wrap:anywhere">${esc(c.t)}</h3>
    <label class="q">O que você fez?<textarea id="qF" rows="2" maxlength="300" placeholder="Gravei 3 takes e escolhi o melhor">${esc(a.fiz||'')}</textarea></label>
    <label class="q">Onde travou?<textarea id="qT" rows="2" maxlength="300" placeholder="Achei que precisava de luz perfeita">${esc(a.travei||'')}</textarea></label>
    <label class="q">O que aprendeu?<textarea id="qA" rows="2" maxlength="300" placeholder="O primeiro take já era bom o suficiente">${esc(a.aprendi||'')}</textarea></label>
    <label class="q">Resultado em número<input type="text" id="qN" maxlength="120" placeholder="3 Reels gravados em 40 minutos" value="${esc(a.num||'')}"></label>
    <div class="sec"><small>Formato</small><div class="rowb">${FMT.map(([k,n])=>`<button class="b" data-f="${k}" aria-current="${k===fmt}">${n}</button>`).join('')}</div></div>
    <div class="rowb"><button class="b pri" id="gen">Gerar post</button><button class="b" id="skip">Pular</button></div>`;
  box.scrollTop=0;$('qF').focus();
  box.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{fmt=b.dataset.f;box.querySelectorAll('[data-f]').forEach(x=>x.setAttribute('aria-current',x===b))});
  $('skip').onclick=close;
  $('gen').onclick=()=>{const ans={fiz:$('qF').value,travei:$('qT').value,aprendi:$('qA').value,num:$('qN').value};showPost(c,ans,fmt,buildPost(c,ans,fmt))};
}
function showPost(c,ans,fmt,text){
  const box=$('sheetIn');
  box.innerHTML=`<small>${FMT.find(f=>f[0]===fmt)[1]} · edite à vontade</small><textarea id="pvT" aria-label="Texto do post">${esc(text)}</textarea>
    <p class="tip">Ao salvar, o post vira um cartão na lista Posts e fica guardado neste cartão.</p>
    <div class="rowb"><button class="b pri" id="svP">Salvar post</button><button class="b" id="cpP">Copiar</button><button class="b" id="bk">Voltar</button></div>`;
  box.scrollTop=0;
  $('cpP').onclick=e=>copy($('pvT').value,e.target);
  $('bk').onclick=()=>{c.post={a:ans,fmt,text:$('pvT').value};openPost(c)};
  $('svP').onclick=()=>{const t=$('pvT').value;
    let pc=c.post&&S.cards.find(x=>x.id===c.post.postId);
    const title=FMT.find(f=>f[0]===fmt)[1]+': '+(clean(ans.num)||clean(c.t));
    if(pc){pc.t=title;pc.desc=t}else{pc={id:Date.now(),t:title,col:'posts',desc:t,labels:['purple'],src:c.id};S.cards.push(pc)}
    c.post={a:ans,fmt,text:t,postId:pc.id};save();close()};
}
function copy(t,btn){const ok=()=>btn.textContent='Copiado';
  try{navigator.clipboard.writeText(t).then(ok).catch(sel)}catch(e){sel()}
  function sel(){const ta=$('pvT');if(ta){ta.select();btn.textContent='Selecionado, copie'}else btn.textContent='Abra o post para copiar'}}
$('sheet').onclick=e=>{if(e.target.id==='sheet')close()};
render();
</script>

</html>
