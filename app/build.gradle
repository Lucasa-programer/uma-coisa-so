plugins { id 'com.android.application' }

android {
    namespace 'com.lucasalianca.umacoisaso'
    compileSdk 34
    defaultConfig {
        applicationId 'com.lucasalianca.umacoisaso'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    def ks = file('keystore.jks')
    signingConfigs {
        fixa {
            if (ks.exists()) {
                storeFile ks
                storePassword System.getenv('KEYSTORE_PASS')
                keyAlias 'umacoisaso'
                keyPassword System.getenv('KEYSTORE_PASS')
            }
        }
    }
    buildTypes {
        debug { if (ks.exists()) signingConfig signingConfigs.fixa }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
